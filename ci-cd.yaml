name: Increase jar patch version, build and push a Docker image

env:
  VERSION: 1.0.${{ github.run_number }}
  Docker_username: bmeytar

on: 
  push:
    branches: [ "main" ]

jobs:
  increase-jar-patch:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Increase version
        run: mvn versions:set -DnewVersion=${{ env.VERSION }}

      - name: Log in to Docker Hub
        uses: docker/login-action@f4ef78c080cd8ba55a85445d5b36e214a81df20a
        with:
          username: ${{ env.Docker_username }}
          password: ${{ secrets.Docker_password }}

      - name: Extract metadata for Docker
        id: meta
        uses: docker/metadata-action@9ec57ed1fcdbf14dcef7dfbe97b2010124a938b7
        with:
          images: bmeytar/github

      - name: Build and push Docker image
        id: push
        uses: docker/build-push-action@3b5e8027fcad23fda98b2e3ac259d8d67585f671
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: bmeytar/github:${{ env.VERSION }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Deploy
        run: docker run --name java bmeytar/github:${{ env.VERSION }}